[general]
import = [ 
	"~/.config/alacritty/tokyo-night.toml",
	"~/.config/alacritty/keybindings.toml"
]

[window]
dimensions = { columns = 120, lines = 35 }
padding = { x = 15, y = 15 }
opacity = 1.00

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 12.0

[cursor.style]
shape = "Underline"
blinking = "On"


