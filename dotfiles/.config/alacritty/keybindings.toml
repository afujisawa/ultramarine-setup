# Aumenta o tamanho da fonte
[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

# Diminui o tamanho da fonte
[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

# Resetar tamanho original da fonte
[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

# Copiar
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

# Colar
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

# Limpar terminal
[[keyboard.bindings]]
key = "L"
mods = "Alt"
chars = "clear\n"

# Modo vim
[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "ToggleViMode"


# Subir uma página no histórico
[[keyboard.bindings]]
key = "PageUp"
action = "ScrollPageUp"

# Descer uma página no histórico
[[keyboard.bindings]]
key = "PageDown"
action = "ScrollPageDown"

# Ir para o topo do histórico
[[keyboard.bindings]]
key = "Home"
mods = "Control"
action = "ScrollToTop"

# Ir para o final do histórico
[[keyboard.bindings]]
key = "End"
mods = "Control"
action = "ScrollToBottom"
