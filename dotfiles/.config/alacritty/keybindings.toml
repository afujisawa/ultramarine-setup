# Aumenta o tamanho da fonte
[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

# Diminui o tamanho da fonte
[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

# Resetar tamanho original da fonte
[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

# Copiar
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

# Colar
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

